name: Release

# Automatic releases, tag/npm-as-source-of-truth (Option B, modeled on rmartz/envctl
# and rmartz/repo-hygiene). semantic-release runs on every push to main through the
# fleet's shared workflow (rmartz/semantic-release-ci): it analyzes the
# conventional-commit subjects since the last vX.Y.Z tag, computes the next version,
# publishes @rmartz/merge-safety to npmjs, creates the git tag + GitHub Release, and
# comments on released PRs/issues. The release toolchain (semantic-release, its
# plugins incl. @semantic-release/exec, and the changelog preset) lives in
# semantic-release-ci, where a toolchain bump is tested before it reaches this pin;
# the options stay here in .releaserc.json.
#
# npm auth is OIDC trusted publishing: npmjs trusts THIS workflow file
# (`release.yml`) in rmartz/merge-safety, so there is no NPM_TOKEN secret. Renaming
# this file breaks publishing until the trusted publisher on npmjs is updated to
# match. Provenance attestations are generated automatically. OIDC publishing needs
# npm >= 11.5.1: the shared workflow runs on Node 24 (npm 11) and, because this
# workflow grants `id-token: write`, fails before tagging if npm is older. Versions up to 0.6.0
# were published to GitHub Packages and stay there, so reusable-workflow pins at
# those tags keep installing from GitHub Packages; later tags install from npmjs.
#
# The npm publish runs in semantic-release's `prepare` step (via
# @semantic-release/exec; @semantic-release/npm only writes the version, with
# npmPublish: false), because semantic-release pushes the git tag after `prepare`
# and before `publish`. Publishing in `publish` left v0.7.0–v0.10.0 as tags with no
# package when npm failed, and the reusable workflow's install step then failed for
# anyone pinned to them. Publishing first means a failed publish aborts the release
# before any tag exists.
#
# There is deliberately NO @semantic-release/git plugin: package.json is never bumped
# back to main (it stays a placeholder — see its "version" field), so the released
# version lives ONLY in the git tag. The reusable workflow (merge-safety.yml) resolves
# the version to install from the release tag at its own pinned commit, not from
# package.json. Only the built-in GITHUB_TOKEN is used — no PAT, no commit-back to a
# protected branch. See docs/consuming.md and AGENTS.md.
#
# Staying on 0.x: while pre-1.0, a breaking change is capped at a MINOR bump (see the
# `{ "breaking": true, "release": "minor" }` rule in .releaserc.json) so an accidental
# `!` cannot auto-jump to 1.0.0. Cutting 1.0.0 is a deliberate manual act at go-live,
# after which that cap rule is removed and breaking → major resumes.

on:
  push:
    branches: [main]
  # Manual backfill: publish the package for an existing vX.Y.Z tag whose release
  # tagged but never published (v0.7.0–v0.10.0 hit this). It lives in this file
  # because the npm trusted publisher is tied to the `release.yml` filename.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm (e.g. v0.10.0)
        required: true

# Serialize releases and backfills so two runs can't publish concurrently. (The
# shared workflow also serializes its release job per repository.)
concurrency: release

# The shared workflow declares no permissions of its own; the release job runs with
# these. The backfill job narrows them to what it needs.
permissions:
  contents: write # create tags and GitHub releases
  id-token: write # npm trusted publishing (OIDC) + provenance
  issues: write # semantic-release comments on released issues
  pull-requests: write # semantic-release comments on released PRs

jobs:
  release:
    if: github.event_name == 'push'
    uses: rmartz/semantic-release-ci/.github/workflows/semantic-release.yml@dbcbcd8e0425ae4c0aa294d6595566ac4643a83d # v1.1.0
    with:
      # Build dist/ before the `prepare`-step `npm publish` packs it; the shared
      # workflow installs this repo's dependencies (pnpm, frozen lockfile) first.
      build-command: pnpm run build

  backfill:
    name: Backfill ${{ inputs.tag }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the tag
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      # Not ./.github/actions/setup: that path now resolves to the TAG's copy, which
      # for v0.7.0–v0.10.0 installs Node 22 (npm 10, which can't publish via OIDC).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # `--tag backfill` keeps an older backfilled version from taking `latest`;
      # consumers install exact versions, so the dist-tag doesn't affect them.
      - name: Publish
        env:
          TAG: ${{ inputs.tag }}
        run: |
          npm pkg set version="${TAG#v}"
          npm publish --tag backfill
