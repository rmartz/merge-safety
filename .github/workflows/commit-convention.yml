name: Conventional Commits (main)

# Post-merge tripwire — the counterpart of pr-title-lint.yml, which validates PR
# titles *pre-merge* but cannot see whether the conventional title actually reached
# `main`. This fails loudly when a subject lands on the default branch without a valid
# conventional-commit prefix: a squash-merge setting that used the branch commit
# message instead of the PR title, a direct push, or a squash that dropped the prefix
# — any of which makes semantic-release silently skip the release (release.yml). It
# alerts; it cannot gate (the commit has already merged).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-convention:
    name: Validate commit subjects on main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the pushed range's history must be present to read subjects
      - name: Validate new commit subjects
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # Conventional-commit subject grammar — mirrors pr-title-lint.yml.
          pattern='^(feat|fix|docs|chore|refactor|test|style|perf|ci|build|revert)(\([^)]+\))?!?: [^[:space:]].*$'
          # On a branch's first push BEFORE is all-zeros; validate just the tip.
          if printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            revs="$AFTER"
          else
            revs="$(git rev-list --first-parent "${BEFORE}..${AFTER}")"
          fi
          status=0
          for sha in $revs; do
            subject="$(git show -s --format=%s "$sha")"
            if printf '%s\n' "$subject" | grep -qE "$pattern"; then
              echo "ok:   $sha $subject"
            else
              echo "FAIL: $sha $subject"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo
            echo "A commit reached ${GITHUB_REF_NAME:-main} with a non-conventional subject."
            echo "semantic-release only releases conventional commits, so it silently skips a"
            echo "non-conventional one. Likely cause: a squash merge used the branch commit"
            echo "message instead of the PR title. Set the repo squash-merge default to"
            echo "'PR_TITLE' (ai-verify-squash-setting --apply) so PR titles reach main."
            exit 1
          fi
          echo "All new commit subjects are valid conventional commits."
