name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Per-ref concurrency: a new push to a branch cancels its in-flight run, but
# main is never cancelled (each push to the default branch runs to completion).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run test

  # Pre-merge guard for the tag-driven publish (release.yml). The `build` job proves
  # the code compiles, but nothing else exercises the *packaging* manifest until the
  # real release run — a broken `files`/`exports`/`bin` mapping, or an entry point the
  # build stopped emitting, would pass CI and only surface after a tag is pushed. This
  # job packs exactly what `pnpm publish` would upload (no registry, no tag, no
  # credentials) and fails the PR if the tarball is malformed or missing a promised
  # entry point.
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run build
      - name: Verify the published tarball ships every manifest entry point
        run: |
          set -euo pipefail
          # `pnpm publish --dry-run` validates the publish manifest and reports the
          # tarball contents without contacting the registry — the manifest check the
          # user asked for. On its own it still exits 0 for a broken `dist`, so we then
          # pack for real (locally) and assert the tarball actually contains every
          # entry point `exports`/`bin` promise. That assertion is the guard with teeth.
          pnpm publish --dry-run --no-git-checks
          tarball="$(pnpm pack | tail -1)"
          tar -tzf "$tarball" | sed 's#^package/##' > packed-files.txt
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const packed = new Set(
              readFileSync("packed-files.txt", "utf8").split("\n").filter(Boolean),
            );
            const refs = new Set();
            const add = (value) => {
              if (typeof value === "string") refs.add(value.replace(/^\.\//, ""));
            };
            for (const entry of Object.values(pkg.exports ?? {})) {
              if (typeof entry === "string") add(entry);
              else for (const target of Object.values(entry)) add(target);
            }
            for (const target of Object.values(pkg.bin ?? {})) add(target);
            const missing = [...refs].filter((path) => !packed.has(path));
            if (missing.length > 0) {
              console.error(
                "Published tarball is missing manifest entry points:\n  " +
                  missing.join("\n  "),
              );
              process.exit(1);
            }
            console.log(
              "All manifest entry points ship in the tarball:\n  " +
                [...refs].join("\n  "),
            );
          '

  release-dry-run:
    name: Release dry-run
    # Validate the semantic-release config — above all that the changelog toolchain
    # (preset + conventional-changelog-writer) still renders — on PRs, so a broken
    # release config is caught here rather than on the post-merge Release run (which
    # only fires on push to main; see release.yml).
    #
    # A plain `semantic-release --dry-run` early-exits on a non-main branch before
    # rendering notes, which would pass a broken config. We override --branches with
    # the PR head ref (which exists on the remote, so semantic-release accepts it as a
    # release branch) to force the analyzeCommits + generateNotes path; --dry-run
    # guarantees nothing is published, tagged, or commented. Restricted to same-repo
    # PRs because a fork's head branch does not exist on this remote.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false # authenticates via GITHUB_TOKEN below
      - uses: ./.github/actions/setup
      - run: pnpm exec semantic-release --dry-run --branches "$HEAD_REF"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
