name: merge-safety (reusable)

# The single entry point consuming repos pin. Unlike a read-only hygiene check, a
# consumer's caller is NOT trigger-free: a reusable workflow cannot declare
# `on: pull_request`/`push`, so the caller carries the triggers, grants the write
# scopes (checks / pull-requests / actions), threads its workflow_dispatch `pr`
# input through `with:`, and passes `secrets: inherit`. The caller is otherwise
# thin — the evaluate-vs-invalidate branch and all label logic live here, because
# a reusable workflow sees the caller's event context. See docs/consuming.md.
#
#   jobs:
#     merge-safety:
#       uses: rmartz/merge-safety/.github/workflows/merge-safety.yml@<sha>  # vX.Y.Z
#       with:
#         pr: ${{ inputs.pr }}
#       secrets: inherit
#
# Dependabot's github-actions ecosystem bumps that <sha> pin via PRs, so updates
# propagate with no per-repo YAML edits. The @rmartz/merge-safety version this
# workflow installs is resolved at runtime from the release tag whose commit is this
# workflow's OWN pinned SHA (job.workflow_sha -> vX.Y.Z tag), so the version lives only
# in the git tag and a pinned ref is fully reproducible — nothing ever writes a version
# into this file, and semantic-release never commits a version bump back to main. See
# docs/consuming.md.
#
# THE CHECK-RUN NAME `merge-safety` IS A FLEET CONTRACT. Every consumer configures
# a required status check of that exact name and the auto-merge gate keys off it;
# it is never renamed here. See docs/check-run-contract.md.
#
# The two jobs install and invoke the published `@rmartz/merge-safety` CLI
# (`ai-merge-safety`), which shipped its full `evaluate` / `invalidate`
# implementation in v0.1.0 (extracted from `@rmartz/pr-review`, ai-tools#247).
# See docs/migration.md for how it was extracted.

on:
  workflow_call:
    inputs:
      pr:
        description: PR number to evaluate (threaded from the caller's workflow_dispatch input).
        type: string
        required: false
        default: ''
      version:
        description: >-
          Optional @rmartz/merge-safety version override. Empty (the default)
          resolves the version from the release tag at this workflow's own pinned
          commit (job.workflow_sha -> vX.Y.Z tag), which is what keeps a SHA pin
          reproducible without hardcoding a version here.
        type: string
        required: false
        default: ''
      node-version:
        description: Node.js version to run under.
        type: string
        required: false
        default: '22'
      caller-workflow:
        description: >-
          The consumer's caller workflow filename, which the invalidate fan-out
          re-dispatches per PR. Defaults to the conventional merge-safety.yml.
        type: string
        required: false
        default: merge-safety.yml

permissions:
  checks: write # post/flip the merge-safety check-run
  pull-requests: write # reconcile update-required / merge-conflict labels
  contents: read
  actions: write # dispatch per-PR evaluate runs on the push fan-out
  packages: read # install the CLI from GitHub Packages

# THERE IS DELIBERATELY NO WORKFLOW-LEVEL `concurrency` HERE. A per-PR group was
# tried (and cancel-in-progress toggled both ways) and removed in #48: GitHub allows
# only one pending run per group and cancels any run it supersedes, so a burst of
# pull_request_target events on one PR — opening a PR and applying three labels fires
# four events in about a second — left `cancelled` runs on the consumer's checks list.
# That reads as a failure to anything inspecting conclusions (it is the same conclusion
# a timed-out run produces) and it accounted for 218 cancelled runs across 11 consumer
# repos. `cancel-in-progress: true` does not help: it only trades cancelled *pending*
# runs for cancelled *in-progress* ones.
#
# Letting the burst's runs overlap is safe because `evaluate` is idempotent. It takes
# only the PR number and base ref from the event; every fact it judges on — title,
# labels, mergeable state, head SHA, base check-runs, the base's required contexts —
# is read live from the API at run time (see runEvaluate in src/bin/merge-safety.ts).
# Concurrent runs for one PR therefore compute the *same* verdict rather than racing
# to impose different ones, post the same check-run (GitHub gates on the latest run
# per name), and issue the same idempotent label add/removes. Ordering does not change
# the outcome, so there is nothing for a concurrency group to protect. The cost is a
# few overlapping ~1-minute runs per burst, which is the trade every composite-Action
# consumer in the fleet already makes.
#
# `invalidate` is the exception and keeps its own serialized group below.

jobs:
  evaluate:
    name: Evaluate one PR
    # Everything that is not a base fan-out event: PR events (pull_request_target /
    # pull_request) and the workflow_dispatch re-dispatch. push + check_suite → invalidate.
    if: github.event_name != 'push' && github.event_name != 'check_suite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          fetch-depth: 0 # merge-base + diffs need full history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@rmartz'
      - name: Resolve @rmartz/merge-safety version
        id: ms
        env:
          OVERRIDE: ${{ inputs.version }}
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE}" ]; then
            version="${OVERRIDE}"
          else
            # Option B: the released version is the SOURCE OF TRUTH in the git tag, not
            # package.json (semantic-release never commits the bump back — see
            # release.yml). job.workflow_sha is the exact commit the consumer pinned
            # (@<sha>); Dependabot only ever pins release-tag commits, so the version is
            # the vX.Y.Z tag whose commit is that SHA (contents: read + the built-in
            # GH_TOKEN suffice for the public repo). --paginate output is captured (not
            # piped to head) so a closed pipe can't trip pipefail.
            tags="$(gh api --paginate \
              "repos/${WORKFLOW_REPO}/tags" \
              --jq ".[] | select(.commit.sha == \"${WORKFLOW_SHA}\") | .name")"
            version="${tags%%$'\n'*}"   # first matching tag name
            version="${version#v}"      # strip the leading v
            if [ -z "${version}" ]; then
              echo "No release tag points at pinned commit ${WORKFLOW_SHA} in ${WORKFLOW_REPO}." >&2
              echo "Dependabot pins release-tag commits; for a non-release SHA, set the 'version:' input." >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Install ai-merge-safety
        env:
          # The public @rmartz/merge-safety package on GitHub Packages is readable
          # with the built-in GITHUB_TOKEN — no consumer PAT required.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install -g "@rmartz/merge-safety@${{ steps.ms.outputs.version }}"
      # Fetch the PR head as git data so merge-base/diffs resolve — the dispatched
      # (workflow_dispatch) path checks out the base and would otherwise lack it.
      - run: git fetch --quiet origin "${BASE_REF}" "pull/${PR_NUMBER}/head"
      - run: ai-merge-safety evaluate --pr "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --base "origin/${BASE_REF}"

  invalidate:
    name: Invalidate open PRs (base moved)
    # The one place serialization is load-bearing: push and a base-branch check_suite
    # completion both fan out over every open PR, so they share a single group and are
    # never cancelled — no base move may be dropped. Scoping the group to this job (and
    # not the workflow) is also what keeps a PR-event run from ever queueing behind a
    # fan-out and being cancelled by the next PR event (#48).
    concurrency:
      group: merge-safety-invalidate
      cancel-in-progress: false
    # Fan out on a push to the base OR when the base branch's own GitHub Actions CI
    # concludes (check_suite completed) — the latter re-holds already-cleared PRs
    # once base health flips (a push-time re-eval sees base CI still *pending*, so
    # the concluded-CI event is what makes a red base actually block non-hotfix PRs,
    # and a green base release them). Filtered to the github-actions app on the
    # default branch: one suite per base commit, not per external deploy integration.
    # No loop: this fan-out's own runs use GITHUB_TOKEN, whose activity GitHub does
    # not let trigger a further check_suite run.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.app.slug == 'github-actions' &&
       github.event.check_suite.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CALLER_WORKFLOW: ${{ inputs.caller-workflow }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@rmartz'
      - name: Resolve @rmartz/merge-safety version
        id: ms
        env:
          OVERRIDE: ${{ inputs.version }}
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE}" ]; then
            version="${OVERRIDE}"
          else
            # See the evaluate job — the version is resolved from the release tag whose
            # commit is this reusable workflow's own pinned SHA, never from package.json
            # (which semantic-release leaves as a placeholder) or hardcoded in this file.
            tags="$(gh api --paginate \
              "repos/${WORKFLOW_REPO}/tags" \
              --jq ".[] | select(.commit.sha == \"${WORKFLOW_SHA}\") | .name")"
            version="${tags%%$'\n'*}"   # first matching tag name
            version="${version#v}"      # strip the leading v
            if [ -z "${version}" ]; then
              echo "No release tag points at pinned commit ${WORKFLOW_SHA} in ${WORKFLOW_REPO}." >&2
              echo "Dependabot pins release-tag commits; for a non-release SHA, set the 'version:' input." >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Install ai-merge-safety
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install -g "@rmartz/merge-safety@${{ steps.ms.outputs.version }}"
      - run: ai-merge-safety invalidate --repo "${GITHUB_REPOSITORY}" --workflow "${CALLER_WORKFLOW}"
