name: merge-safety (reusable)

# The single entry point consuming repos pin. Unlike a read-only hygiene check, a
# consumer's caller is NOT trigger-free: a reusable workflow cannot declare
# `on: pull_request`/`push`, so the caller carries the triggers, grants the write
# scopes (checks / pull-requests / actions), threads its workflow_dispatch `pr`
# input through `with:`, and passes `secrets: inherit`. The caller is otherwise
# thin — the evaluate-vs-invalidate branch and all label logic live here, because
# a reusable workflow sees the caller's event context. See docs/consuming.md.
#
#   jobs:
#     merge-safety:
#       uses: rmartz/merge-safety/.github/workflows/merge-safety.yml@<sha>  # vX.Y.Z
#       with:
#         pr: ${{ inputs.pr }}
#       secrets: inherit
#
# Dependabot's github-actions ecosystem bumps that <sha> pin via PRs, so updates
# propagate with no per-repo YAML edits. The @rmartz/merge-safety version this
# workflow installs is resolved at runtime from this workflow's OWN pinned commit
# (job.workflow_sha reads package.json), so the version lives only in package.json
# and a pinned ref is fully reproducible — nothing ever writes a version into this
# file. See docs/consuming.md.
#
# THE CHECK-RUN NAME `merge-safety` IS A FLEET CONTRACT. Every consumer configures
# a required status check of that exact name and the auto-merge gate keys off it;
# it is never renamed here. See docs/check-run-contract.md.
#
# The two jobs install and invoke the published `@rmartz/merge-safety` CLI
# (`ai-merge-safety`), which shipped its full `evaluate` / `invalidate`
# implementation in v0.1.0 (extracted from `@rmartz/pr-review`, ai-tools#247).
# See docs/migration.md for how it was extracted.

on:
  workflow_call:
    inputs:
      pr:
        description: PR number to evaluate (threaded from the caller's workflow_dispatch input).
        type: string
        required: false
        default: ''
      version:
        description: >-
          Optional @rmartz/merge-safety version override. Empty (the default)
          resolves the version from this workflow's own pinned commit
          (job.workflow_sha -> package.json), which is what keeps a SHA pin
          reproducible without hardcoding a version here.
        type: string
        required: false
        default: ''
      node-version:
        description: Node.js version to run under.
        type: string
        required: false
        default: '22'
      caller-workflow:
        description: >-
          The consumer's caller workflow filename, which the invalidate fan-out
          re-dispatches per PR. Defaults to the conventional merge-safety.yml.
        type: string
        required: false
        default: merge-safety.yml

permissions:
  checks: write # post/flip the merge-safety check-run
  pull-requests: write # reconcile update-required / merge-conflict labels
  contents: read
  actions: write # dispatch per-PR evaluate runs on the push fan-out
  packages: read # install the CLI from GitHub Packages

concurrency:
  # push and a base-branch check_suite completion both fan out (invalidate), so they
  # share one serialized group; PR events key on the PR number.
  group: merge-safety-${{ (github.event_name == 'push' || github.event_name == 'check_suite') && 'invalidate' || github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate one PR
    # Everything that is not a base fan-out event: PR events (pull_request_target /
    # pull_request) and the workflow_dispatch re-dispatch. push + check_suite → invalidate.
    if: github.event_name != 'push' && github.event_name != 'check_suite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          fetch-depth: 0 # merge-base + diffs need full history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@rmartz'
      - name: Resolve @rmartz/merge-safety version
        id: ms
        env:
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE}" ]; then
            version="${OVERRIDE}"
          else
            # job.workflow_sha / job.workflow_repository = THIS reusable workflow's
            # own repo and the exact commit the consumer pinned (@<sha>), so the
            # installed version is a pure function of the pinned ref (contents: read
            # + the built-in GH_TOKEN suffice for the public repo).
            version="$(gh api \
              "repos/${{ job.workflow_repository }}/contents/package.json?ref=${{ job.workflow_sha }}" \
              --jq '.content' | base64 --decode | jq -r .version)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Install ai-merge-safety
        env:
          # The public @rmartz/merge-safety package on GitHub Packages is readable
          # with the built-in GITHUB_TOKEN — no consumer PAT required.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install -g "@rmartz/merge-safety@${{ steps.ms.outputs.version }}"
      # Fetch the PR head as git data so merge-base/diffs resolve — the dispatched
      # (workflow_dispatch) path checks out the base and would otherwise lack it.
      - run: git fetch --quiet origin "${BASE_REF}" "pull/${PR_NUMBER}/head"
      - run: ai-merge-safety evaluate --pr "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --base "origin/${BASE_REF}"

  invalidate:
    name: Invalidate open PRs (base moved)
    # Fan out on a push to the base OR when the base branch's own GitHub Actions CI
    # concludes (check_suite completed) — the latter re-holds already-cleared PRs
    # once base health flips (a push-time re-eval sees base CI still *pending*, so
    # the concluded-CI event is what makes a red base actually block non-hotfix PRs,
    # and a green base release them). Filtered to the github-actions app on the
    # default branch: one suite per base commit, not per external deploy integration.
    # No loop: this fan-out's own runs use GITHUB_TOKEN, whose activity GitHub does
    # not let trigger a further check_suite run.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.app.slug == 'github-actions' &&
       github.event.check_suite.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CALLER_WORKFLOW: ${{ inputs.caller-workflow }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@rmartz'
      - name: Resolve @rmartz/merge-safety version
        id: ms
        env:
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE}" ]; then
            version="${OVERRIDE}"
          else
            # See the evaluate job — the version is resolved from this reusable
            # workflow's own pinned commit, never hardcoded in this file.
            version="$(gh api \
              "repos/${{ job.workflow_repository }}/contents/package.json?ref=${{ job.workflow_sha }}" \
              --jq '.content' | base64 --decode | jq -r .version)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Install ai-merge-safety
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install -g "@rmartz/merge-safety@${{ steps.ms.outputs.version }}"
      - run: ai-merge-safety invalidate --repo "${GITHUB_REPOSITORY}" --workflow "${CALLER_WORKFLOW}"
