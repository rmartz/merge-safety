name: merge-safety

# This repo consumes its own merge-safety through the exact caller every consuming
# repo uses (rmartz/merge-safety-action's docs/consuming.md), so its own PRs get the
# `merge-safety` check-run and it can be a required status check here too. It pins
# a RELEASED action by SHA, which in turn pins a released @rmartz/merge-safety in
# its lockfile — so PRs here are gated by the last released CLI, not the code under
# review. Dependabot's github-actions ecosystem bumps the pin, like any consumer.
#
# The caller is named merge-safety-self.yml because merge-safety.yml is the
# (deprecated) reusable workflow itself. The action's invalidate fan-out
# re-dispatches the workflow it is running in, so no filename input is needed.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: true

permissions:
  checks: write # post/flip the merge-safety check-run
  statuses: write # mirror the verdict to the merge-safety commit status (#73)
  pull-requests: write # reconcile update-required / merge-conflict labels
  contents: read
  actions: write # re-dispatch this workflow per open PR when the base moves

jobs:
  merge-safety:
    # Skip, without a runner, the events the action would no-op on: another app's
    # check suite, a non-default branch's suite, a tag push, a branch deletion.
    if: >-
      (github.event_name != 'push' && github.event_name != 'check_suite') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && !github.event.deleted) ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.app.slug == 'github-actions' &&
       github.event.check_suite.head_branch == github.event.repository.default_branch)
    # Base-moved fan-outs serialize per branch and are never cancelled; each per-PR
    # evaluate run gets its own group (run_id), so a burst of PR events never
    # queues or cancels a run (#48).
    concurrency:
      group: >-
        ${{ (github.event_name == 'push' || github.event_name == 'check_suite')
        && format('merge-safety-invalidate-{0}', github.event_name == 'push' && github.ref_name || github.event.check_suite.head_branch)
        || format('merge-safety-evaluate-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: rmartz/merge-safety-action@df715a83fb6f6db58b0b196c913b6ebddcd975b5 # v0.1.1
        with:
          pr: ${{ inputs.pr }}
