version: 2
# Cooldown: since 2026-07-14 Dependabot waits 3 days after a release before
# proposing it, even with no `cooldown` configured. Third-party dependencies keep
# that default (security updates are never delayed by it). Only first-party
# releases (`rmartz/*` actions and reusable workflows) are exempt: they're
# published from our own repos with provenance, so the wait adds no supply-chain
# protection and only holds fixes back from the fleet.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Daily, not weekly: merge-safety-self.yml consumes rmartz/merge-safety-action
      # through a pinned SHA, and this ecosystem is what bumps that pin. Daily keeps
      # the self-caller within a day of the latest action release.
      interval: daily
    cooldown:
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - 'rmartz/*'
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Action patch and minor bumps batch into one PR; every major opens as its
      # own PR. The dependabot-auto-merge workflow arms auto-merge only for
      # patch/minor, so a major is held for human review on its own without
      # holding the routine bumps back.
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Split by dependency type (rmartz/ai#82): a production bump ships to
      # users, so it is a `fix` that cuts a release; a dev-dependency bump never
      # reaches the shipped artifact, so it is a release-less `chore`.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # CI-sensitive tools in one group: pr-policy requires a `ci` title for any
      # eslint/prettier version change (the formatter/linter can fail files a PR
      # never touched), so they must not ride in a catch-all where they would
      # block every routine bump. Plugins and configs move in lockstep with their
      # tool. No update-types filter, so a major brings its family with it.
      ci:
        patterns:
          - 'prettier'
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'prettier'
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
