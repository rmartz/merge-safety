version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Daily, not weekly: merge-safety-self.yml dogfoods this repo's own reusable
      # workflow through a pinned release tag, and this ecosystem is what bumps
      # that pin. Daily keeps the dogfood within a day of the latest release.
      interval: daily
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Every action bump, majors included, lands in one PR. The
      # dependabot-auto-merge workflow arms auto-merge only for patch/minor, so a
      # group containing a major is held for human review (fetch-metadata reports
      # the group's highest update-type), and a major that breaks CI is split out
      # into its own fix PR rather than holding the rest of the group back.
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Split by dependency type (rmartz/ai#82): a production bump ships to
      # users, so it is a `fix` that cuts a release; a dev-dependency bump never
      # reaches the shipped artifact, so it is a release-less `chore`.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Prettier isolated into its own group so a reformatting bump can't hide in a
      # catch-all (a Prettier minor can reformat the whole tree).
      prettier:
        patterns:
          - 'prettier'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'prettier'
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
