version: 2
# Cooldown: since 2026-07-14 Dependabot waits 3 days after a release before
# proposing it, even with no `cooldown` configured. Third-party dependencies keep
# that default (security updates are never delayed by it). Only first-party
# releases (`rmartz/*` actions and reusable workflows) are exempt: they're
# published from our own repos with provenance, so the wait adds no supply-chain
# protection and only holds fixes back from the fleet.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Daily, not weekly: merge-safety-self.yml consumes rmartz/merge-safety-action
      # through a pinned SHA, and this ecosystem is what bumps that pin. Daily keeps
      # the self-caller within a day of the latest action release.
      interval: daily
    cooldown:
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - 'rmartz/*'
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Every action bump, majors included, lands in one PR. The
      # dependabot-auto-merge workflow arms auto-merge only for patch/minor, so a
      # group containing a major is held for human review (fetch-metadata reports
      # the group's highest update-type), and a major that breaks CI is split out
      # into its own fix PR rather than holding the rest of the group back.
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Split by dependency type (rmartz/ai#82): a production bump ships to
      # users, so it is a `fix` that cuts a release; a dev-dependency bump never
      # reaches the shipped artifact, so it is a release-less `chore`.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Prettier isolated into its own group so a reformatting bump can't hide in a
      # catch-all (a Prettier minor can reformat the whole tree).
      prettier:
        patterns:
          - 'prettier'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'prettier'
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
