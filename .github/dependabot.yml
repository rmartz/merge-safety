version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minor/patch bumps batched; majors fall out into isolated PRs for review.
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Split by dependency type (rmartz/ai#82): a production bump ships to
      # users, so it is a `fix` that cuts a release; a dev-dependency bump never
      # reaches the shipped artifact, so it is a release-less `chore`.
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # The conventionalcommits preset major is coupled to conventional-changelog-writer,
      # which we do not depend on directly — semantic-release ships it transitively. A
      # preset major that outruns that writer cannot render (it broke every push to main
      # once #39 bumped it 8 -> 10). Hold at the current major until semantic-release
      # upgrades its writer, then bump the preset major deliberately alongside it. 9.x
      # minor/patch updates still flow. The Release notes render CI guard is the backstop.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]
    groups:
      # Prettier isolated into its own group so a reformatting bump can't hide in a
      # catch-all (a Prettier minor can reformat the whole tree).
      prettier:
        patterns:
          - 'prettier'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'prettier'
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
