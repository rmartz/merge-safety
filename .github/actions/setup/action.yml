name: Setup
description: Install pnpm, Node.js, and project dependencies

inputs:
  frozen-lockfile:
    description: Use --frozen-lockfile for pnpm install
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # pnpm version comes from packageManager in package.json
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm
        # Route @rmartz-scoped packages to GitHub Packages so pnpm can resolve
        # runtime deps like @rmartz/github. Auth is the env-ref token below.
        registry-url: https://npm.pkg.github.com
        scope: '@rmartz'
    - run: pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      shell: bash
      env:
        # github.token can read this org's GitHub Packages when the calling job
        # grants `packages: read`. The committed .npmrc reads it via ${NODE_AUTH_TOKEN}.
        NODE_AUTH_TOKEN: ${{ github.token }}
